name: Build IslandDigest

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  build:
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        scheme: [roothide, rootless]
    env:
      THEOS: /tmp/theos
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: brew install ldid xz

      - name: Install Theos and SDKs
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.scheme }}" = roothide ]; then
            repository=https://github.com/roothide/theos.git
          else
            repository=https://github.com/theos/theos.git
          fi
          git clone --recursive --depth 1 "$repository" "$THEOS"
          git clone --depth 1 https://github.com/theos/sdks.git /tmp/theos-sdks
          cp -R /tmp/theos-sdks/iPhoneOS16.5.sdk "$THEOS/sdks/"
          git -C "$THEOS" rev-parse HEAD
          git -C /tmp/theos-sdks rev-parse HEAD
          xcodebuild -version

      - name: Check source contracts
        run: |
          python3 tests/check_source.py
          cc -Wall -Wextra -Werror tests/Experience.c -o /tmp/id-experience-tests
          /tmp/id-experience-tests

      - name: Build package
        run: make package FINALPACKAGE=1 DEBUG=0 THEOS_PACKAGE_SCHEME=${{ matrix.scheme }}

      - name: Run package checks
        run: |
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          packages = list(Path('packages').glob('*.deb'))
          assert len(packages) == 1, packages
          subprocess.run(['python3', 'tests/check_package.py', str(packages[0]),
                          '0.1.6', '${{ matrix.scheme }}'], check=True)
          PY

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: IslandDigest-${{ matrix.scheme }}
          path: packages/*.deb
          if-no-files-found: error
